# 配置模板：复制为 config/config.yaml 后填写（config.yaml 不入库）

telegram:
  session_name: autotrade_session   # Telethon 会话文件名
  api_id: 0                          # 从 https://my.telegram.org 申请
  api_hash: ""
  # 信号群由开发者锁定（src/autotrade/constants.py），不可自定义
  proxy:                             # TG 直连超时（被墙）时必开：本地代理/VPN
    enabled: false
    type: socks5                     # socks5 | http
    addr: 127.0.0.1
    port: 7890                       # Clash 默认 7890；v2rayN socks 10808 / http 10809

dry_run: true                        # true = 只解析落库、不下单

exchanges:
  active: bybit                      # bybit | binance | bitget | gate | deepcoin | bitunix
  proxy:                             # 交易所 API 代理（大陆直连超时/被墙时必开）
    enabled: false
    type: http                       # http | socks5
    addr: 127.0.0.1
    port: 7897
  bybit:
    apiKey: ""
    secret: ""
  binance:
    apiKey: ""
    secret: ""
  bitget:
    apiKey: ""
    secret: ""
    passphrase: ""                   # passphrase 必填
  gate:
    apiKey: ""
    secret: ""
  deepcoin:
    apiKey: ""
    secret: ""
    passphrase: ""                   # passphrase 必填
  bitunix:
    apiKey: ""
    secret: ""

risk:
  max_concurrent_positions: 3
  daily_loss_pct: 5.0                # 单日亏损上限（占总权益）
  max_slippage_pct: 0.3              # 市价补单滑点阈值
  margin_formula_tol_pct: 0.1        # 保证金复算校验容差
  tp_ratios: equal                   # equal = n 档均分；或写死 [0.3, 0.3, 0.2, 0.2]
  order_multiplier: 1.0              # 下单倍数：报单「控仓 x%」的 R 值缩放（0.5=减半，2=加倍）
  watchdog_interval_sec: 30          # 看护轮询间隔：全平后清理交易所残留挂单

analysts:
  allow_all: true                    # false 时仅跟 list 中的分析师
  list: ["Lazycat", "Trader X"]

behavior:
  amend_sl_on_move: true             # 自動移損/套保 → 改 SL
  close_on_manual_close: true        # 🟥 已平倉/平仓 → 全平剩余 + 撤该 symbol 挂单
  cancel_symbol_orders_on_terminal: true   # SL 或最终 TP 触发 → 撤该 symbol 全部挂单

notify:
  send_to: ""                        # 执行回执发送的 TG 会话（可选，留空不通知）

storage:
  db_path: data/autotrade.db         # SQLite 库路径（信号/事件/持仓/审计）
