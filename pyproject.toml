[project]
name = "autotrade"
version = "0.1.0"
description = "Telegram 信號自動跟單機器人"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.34",
    "ccxt>=4.3",
    "ruamel.yaml>=0.18",
    "aiosqlite>=0.20",
    "python-socks>=2.0",   # Telethon 網絡連線支持
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
